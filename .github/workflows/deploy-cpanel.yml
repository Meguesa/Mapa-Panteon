name: Publicar Mapa independiente en cPanel

on:
  workflow_dispatch:
    inputs:
      publicar_datos_estructurales:
        description: 'Republicar tambien GeoJSON, geometrías y activos estructurales'
        required: false
        default: false
        type: boolean
      publicar_solo_referencias_visuales:
        description: 'Publicar solo el JS y las fotos de referencias visuales (Americano/VIP)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-mapa-independiente
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Mapa
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar MSAL local para produccion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-msal
          npm install --prefix .tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir paquete autonomo del Mapa con Nichos V2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/build_portal_map.py \
            tools/build_nichos_v2_preview.py \
            tools/apply_nichos_v2_v11.py \
            tools/apply_nichos_v2_png_v12.py \
            tools/apply_nichos_v2_production.py
          python3 tools/build_portal_map.py
          python3 tools/apply_nichos_v2_production.py
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js
          rm -rf .tmp-msal

      - name: Validar paquete y datos estructurales
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/index.php
          test -s deploy/app.js
          test -s deploy/styles.css
          test -s deploy/sharepoint-inventario.js
          test -s deploy/public-ui-fixes.js
          test -s deploy/section-visual-references.js
          test -s deploy/portal-integration.css
          test -s deploy/account-menu.css
          test -s deploy/mapa-enhancements.js
          test -s deploy/lotes-nv2-match.js
          test -s deploy/nichos-v2-preview.js
          test -s deploy/nichos-v2-preview.css
          test -s deploy/nichos-v2-map-integration.js
          test -s deploy/assets/logo.jpg
          test -s deploy/assets/map/base-public.webp
          test -s deploy/assets/americano-01.webp
          test -s deploy/assets/americano-02.webp
          test -s deploy/assets/americano-03.webp
          test -s deploy/assets/americano-04.webp
          test -s deploy/assets/vip-01.webp
          test -s deploy/assets/vip-02.webp
          test -s deploy/assets/vip-03.webp
          test -s deploy/assets/PLN-concavo.png
          test -s deploy/assets/PLN-convexo.png
          test -s deploy/assets/SPN-concavo.png
          test -s deploy/assets/SPN-convexo.png
          test -s deploy/vendor/msal-browser.min.js
          test -d deploy/data
          test -s deploy/data/lotes.json
          test -s deploy/data/secciones.geojson
          test -s deploy/data/secciones-top.geojson
          test -s deploy/data/catalogo-propiedades.json
          test -s deploy/data/inventario-base.json
          test -s deploy/data/inventario-overrides.json
          test -s deploy/data/paquetes.json
          test -s deploy/data/PLN-concavo.geojson
          test -s deploy/data/PLN-convexo.geojson
          test -s deploy/data/SPN-concavo.geojson
          test -s deploy/data/SPN-convexo.geojson
          test -s deploy/data/nichos-zonas.geojson
          php -l deploy/index.php
          node --check deploy/nichos-v2-preview.js
          node --check deploy/lotes-nv2-match.js
          grep -q 'Mapa del Panteón' deploy/index.php
          grep -q 'portal_require_authentication' deploy/index.php
          grep -q 'section-visual-references.js' deploy/index.php
          grep -q 'lotes-nv2-match.js?v=1' deploy/index.php
          grep -q 'nichos-v2-preview.css?v=14' deploy/index.php
          grep -q 'nichos-v2-preview.js?v=14' deploy/index.php
          grep -q 'nichos-v2-map-integration.js?v=14' deploy/index.php
          grep -q "const PREVIEW_ROOT = '/mapa';" deploy/nichos-v2-preview.js
          grep -q 'state.nichesVisible = !state.nichesVisible' deploy/nichos-v2-preview.js
          grep -q 'function renderVectorLabels' deploy/nichos-v2-preview.js
          grep -q 'function fitWholeImage' deploy/nichos-v2-preview.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('deploy/data').rglob('*.json')) + list(Path('deploy/data').rglob('*.geojson'))
          if not files:
              raise SystemExit('No se encontraron archivos JSON/GeoJSON en deploy/data')

          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f'Archivo vacio: {path}')
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  raise SystemExit(f'JSON invalido en {path}: {exc}')

          expected = {
              'PLN-concavo.geojson': 402,
              'PLN-convexo.geojson': 474,
              'SPN-concavo.geojson': 306,
              'SPN-convexo.geojson': 360,
          }
          for name, count in expected.items():
              with (Path('deploy/data') / name).open('r', encoding='utf-8') as fh:
                  data = json.load(fh)
              actual = len(data.get('features', []))
              if actual != count:
                  raise SystemExit(f'Conteo invalido en {name}: {actual} != {count}')

          print(f'Validados correctamente {len(files)} archivos JSON/GeoJSON.')
          PY

      - name: Instalar cliente FTPS resiliente
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar Mapa por lotes FTPS
        shell: bash
        timeout-minutes: 25
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FULL_DATA: ${{ inputs.publicar_datos_estructurales }}
          VISUAL_ONLY: ${{ inputs.publicar_solo_referencias_visuales }}
        run: |
          set -euo pipefail
          FTP_URL='ftp://whm95.mxwebserver.com:21'

          run_batch() {
            local label="$1"
            local timeout_seconds="$2"
            local commands="$3"

            for attempt in 1 2 3; do
              echo "[${label}] intento ${attempt} de 3"
              if timeout --kill-after=15s "${timeout_seconds}s" lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_URL" -e "
                set cmd:fail-exit yes;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ftp:sync-mode true;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                set net:timeout 30;
                set net:max-retries 2;
                set net:reconnect-interval-base 5;
                set net:reconnect-interval-max 15;
                set xfer:clobber yes;
                set cmd:fail-exit no;
                mkdir assets;
                mkdir data;
                mkdir vendor;
                set cmd:fail-exit yes;
                ${commands}
                bye;
              "; then
                echo "[${label}] OK"
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "[${label}] fallo. Reintento completo en 20 segundos..."
                sleep 20
              fi
            done

            echo "[${label}] ERROR despues de 3 intentos"
            return 1
          }

          CODE_AND_SMALL_DATA="
            put 'deploy/index.php' -o 'index.php';
            put 'deploy/app.js' -o 'app.js';
            put 'deploy/styles.css' -o 'styles.css';
            put 'deploy/portal-integration.css' -o 'portal-integration.css';
            put 'deploy/account-menu.css' -o 'account-menu.css';
            put 'deploy/mapa-enhancements.js' -o 'mapa-enhancements.js';
            put 'deploy/lotes-nv2-match.js' -o 'lotes-nv2-match.js';
            put 'deploy/public-ui-fixes.js' -o 'public-ui-fixes.js';
            put 'deploy/section-visual-references.js' -o 'section-visual-references.js';
            put 'deploy/sharepoint-inventario.js' -o 'sharepoint-inventario.js';
            put 'deploy/nichos-v2-preview.js' -o 'nichos-v2-preview.js';
            put 'deploy/nichos-v2-preview.css' -o 'nichos-v2-preview.css';
            put 'deploy/nichos-v2-map-integration.js' -o 'nichos-v2-map-integration.js';
            put 'deploy/vendor/msal-browser.min.js' -o 'vendor/msal-browser.min.js';
            put 'deploy/data/nichos-zonas.geojson' -o 'data/nichos-zonas.geojson';
            put 'deploy/data/PLN-concavo.geojson' -o 'data/PLN-concavo.geojson';
            put 'deploy/data/PLN-convexo.geojson' -o 'data/PLN-convexo.geojson';
            put 'deploy/data/SPN-concavo.geojson' -o 'data/SPN-concavo.geojson';
            put 'deploy/data/SPN-convexo.geojson' -o 'data/SPN-convexo.geojson';
            put 'deploy/data/lotes.json' -o 'data/lotes.json';
            put 'deploy/data/paquetes.json' -o 'data/paquetes.json';
            put 'deploy/data/inventario-overrides.json' -o 'data/inventario-overrides.json';
          "

          VISUAL_REFERENCES="
            put 'deploy/section-visual-references.js' -o 'section-visual-references.js';
            put 'deploy/assets/americano-01.webp' -o 'assets/americano-01.webp';
            put 'deploy/assets/americano-02.webp' -o 'assets/americano-02.webp';
            put 'deploy/assets/americano-03.webp' -o 'assets/americano-03.webp';
            put 'deploy/assets/americano-04.webp' -o 'assets/americano-04.webp';
            put 'deploy/assets/vip-01.webp' -o 'assets/vip-01.webp';
            put 'deploy/assets/vip-02.webp' -o 'assets/vip-02.webp';
            put 'deploy/assets/vip-03.webp' -o 'assets/vip-03.webp';
          "

          NICHOS_IMAGES="
            put -c 'deploy/assets/PLN-concavo.png' -o 'assets/PLN-concavo.png';
            put -c 'deploy/assets/PLN-convexo.png' -o 'assets/PLN-convexo.png';
            put -c 'deploy/assets/SPN-concavo.png' -o 'assets/SPN-concavo.png';
            put -c 'deploy/assets/SPN-convexo.png' -o 'assets/SPN-convexo.png';
          "

          if [ "$VISUAL_ONLY" = "true" ]; then
            echo "=== Publicacion exclusiva de referencias visuales ==="
            run_batch 'referencias visuales' 300 "$VISUAL_REFERENCES"
            echo "Publicacion exclusiva de referencias visuales completada correctamente."
            exit 0
          fi

          echo "=== Publicacion agrupada de codigo y datos pequenos ==="
          run_batch 'codigo y datos pequenos' 420 "$CODE_AND_SMALL_DATA"

          echo "=== Publicacion agrupada de referencias visuales ==="
          run_batch 'referencias visuales' 300 "$VISUAL_REFERENCES"

          echo "=== Publicacion agrupada de imagenes grandes de Nichos V2 ==="
          run_batch 'imagenes Nichos V2' 1500 "$NICHOS_IMAGES"

          if [ "$FULL_DATA" = "true" ]; then
            echo "=== Republicacion estructural solicitada ==="

            STRUCTURAL_FILES="
              put 'deploy/data/catalogo-propiedades.json' -o 'data/catalogo-propiedades.json';
              put 'deploy/data/inventario-base.json' -o 'data/inventario-base.json';
              put 'deploy/data/nichos-overlay.geojson' -o 'data/nichos-overlay.geojson';
              put 'deploy/data/secciones-top.geojson' -o 'data/secciones-top.geojson';
              put 'deploy/data/secciones.geojson' -o 'data/secciones.geojson';
              put 'deploy/assets/logo.jpg' -o 'assets/logo.jpg';
              put -c 'deploy/assets/map/base-public.webp' -o 'assets/map/base-public.webp';
              mirror -R --only-newer --parallel=1 'deploy/data/lotes' 'data/lotes';
            "
            run_batch 'datos estructurales' 1500 "$STRUCTURAL_FILES"
          else
            echo "Datos estructurales sin cambios: se conserva la version estable ya publicada en cPanel."
          fi

          echo "Publicacion del Mapa completada correctamente con sesiones FTPS agrupadas."
