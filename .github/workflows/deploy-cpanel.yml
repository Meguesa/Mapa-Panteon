name: Publicar Mapa independiente en cPanel

on:
  workflow_dispatch:
    inputs:
      publicar_datos_estructurales:
        description: 'Republicar GeoJSON, inventario base, mapa base y data/lotes'
        required: false
        default: false
        type: boolean
      publicar_solo_referencias_visuales:
        description: 'Publicar solamente las fotos Americano/VIP y su JS'
        required: false
        default: false
        type: boolean
      publicar_imagenes_nichos_v2:
        description: 'Republicar las 4 imagenes PNG grandes de Nichos V2'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-mapa-independiente
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Mapa
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar MSAL local para produccion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-msal
          npm install --prefix .tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir paquete autonomo del Mapa con Nichos V2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/build_portal_map.py \
            tools/build_nichos_v2_preview.py \
            tools/apply_nichos_v2_v11.py \
            tools/apply_nichos_v2_png_v12.py \
            tools/apply_nichos_v2_production.py
          python3 tools/build_portal_map.py
          python3 tools/apply_nichos_v2_production.py
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js
          rm -rf .tmp-msal

      - name: Validar paquete de produccion
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            deploy/index.php
            deploy/app.js
            deploy/styles.css
            deploy/sharepoint-inventario.js
            deploy/public-ui-fixes.js
            deploy/section-visual-references.js
            deploy/portal-integration.css
            deploy/account-menu.css
            deploy/mapa-enhancements.js
            deploy/lotes-nv2-match.js
            deploy/nichos-v2-preview.js
            deploy/nichos-v2-preview.css
            deploy/nichos-v2-map-integration.js
            deploy/assets/logo.jpg
            deploy/assets/map/base-public.webp
            deploy/assets/americano-01.webp
            deploy/assets/americano-02.webp
            deploy/assets/americano-03.webp
            deploy/assets/americano-04.webp
            deploy/assets/vip-01.webp
            deploy/assets/vip-02.webp
            deploy/assets/vip-03.webp
            deploy/assets/PLN-concavo.png
            deploy/assets/PLN-convexo.png
            deploy/assets/SPN-concavo.png
            deploy/assets/SPN-convexo.png
            deploy/vendor/msal-browser.min.js
            deploy/data/lotes.json
            deploy/data/secciones.geojson
            deploy/data/secciones-top.geojson
            deploy/data/catalogo-propiedades.json
            deploy/data/inventario-base.json
            deploy/data/inventario-overrides.json
            deploy/data/paquetes.json
            deploy/data/PLN-concavo.geojson
            deploy/data/PLN-convexo.geojson
            deploy/data/SPN-concavo.geojson
            deploy/data/SPN-convexo.geojson
            deploy/data/nichos-zonas.geojson
          )

          for file in "${required_files[@]}"; do
            test -s "$file"
          done

          test -d deploy/data
          test -d deploy/data/lotes

          php -l deploy/index.php
          node --check deploy/app.js
          node --check deploy/public-ui-fixes.js
          node --check deploy/lotes-nv2-match.js
          node --check deploy/nichos-v2-preview.js
          node --check deploy/nichos-v2-map-integration.js

          grep -q 'Mapa del Panteón' deploy/index.php
          grep -q 'portal_require_authentication' deploy/index.php
          grep -q 'section-visual-references.js' deploy/index.php
          grep -q 'lotes-nv2-match.js?v=1' deploy/index.php
          grep -q 'nichos-v2-preview.css?v=14' deploy/index.php
          grep -q 'nichos-v2-preview.js?v=14' deploy/index.php
          grep -q 'nichos-v2-map-integration.js?v=14' deploy/index.php
          grep -q "const PREVIEW_ROOT = '/mapa';" deploy/nichos-v2-preview.js
          grep -q 'state.nichesVisible = !state.nichesVisible' deploy/nichos-v2-preview.js
          grep -q 'function renderVectorLabels' deploy/nichos-v2-preview.js
          grep -q 'function fitWholeImage' deploy/nichos-v2-preview.js
          grep -q 'syncLotInteractivity' deploy/lotes-nv2-match.js
          grep -q 'seleccion por clic habilitada' deploy/lotes-nv2-match.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('deploy/data').rglob('*.json')) + list(Path('deploy/data').rglob('*.geojson'))
          if not files:
              raise SystemExit('No se encontraron archivos JSON/GeoJSON en deploy/data')

          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f'Archivo vacio: {path}')
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  raise SystemExit(f'JSON invalido en {path}: {exc}')

          expected = {
              'PLN-concavo.geojson': 402,
              'PLN-convexo.geojson': 474,
              'SPN-concavo.geojson': 306,
              'SPN-convexo.geojson': 360,
          }
          for name, count in expected.items():
              with (Path('deploy/data') / name).open('r', encoding='utf-8') as fh:
                  data = json.load(fh)
              actual = len(data.get('features', []))
              if actual != count:
                  raise SystemExit(f'Conteo invalido en {name}: {actual} != {count}')

          print(f'Validados correctamente {len(files)} archivos JSON/GeoJSON.')
          PY

      - name: Preparar paquetes de publicacion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy-code deploy-visual deploy-nichos-assets deploy-structural

          # Paquete normal: solo codigo, dependencias, referencias visuales pequenas
          # y geometria pequena de Nichos V2. No vuelve a transferir imagenes de 40-55 MB.
          mkdir -p deploy-code/assets deploy-code/data deploy-code/vendor

          for file in \
            index.php \
            app.js \
            styles.css \
            portal-integration.css \
            account-menu.css \
            mapa-enhancements.js \
            lotes-nv2-match.js \
            public-ui-fixes.js \
            section-visual-references.js \
            sharepoint-inventario.js \
            nichos-v2-preview.js \
            nichos-v2-preview.css \
            nichos-v2-map-integration.js; do
            cp "deploy/$file" "deploy-code/$file"
          done

          cp deploy/vendor/msal-browser.min.js deploy-code/vendor/msal-browser.min.js
          cp deploy/assets/logo.jpg deploy-code/assets/logo.jpg

          for file in \
            americano-01.webp \
            americano-02.webp \
            americano-03.webp \
            americano-04.webp \
            vip-01.webp \
            vip-02.webp \
            vip-03.webp; do
            cp "deploy/assets/$file" "deploy-code/assets/$file"
          done

          for file in \
            nichos-zonas.geojson \
            PLN-concavo.geojson \
            PLN-convexo.geojson \
            SPN-concavo.geojson \
            SPN-convexo.geojson \
            lotes.json \
            paquetes.json \
            inventario-overrides.json; do
            cp "deploy/data/$file" "deploy-code/data/$file"
          done

          # Paquete exclusivo de referencias visuales.
          mkdir -p deploy-visual/assets
          cp deploy/section-visual-references.js deploy-visual/section-visual-references.js
          for file in \
            americano-01.webp \
            americano-02.webp \
            americano-03.webp \
            americano-04.webp \
            vip-01.webp \
            vip-02.webp \
            vip-03.webp; do
            cp "deploy/assets/$file" "deploy-visual/assets/$file"
          done

          # Paquete de imagenes grandes de Nichos V2. Solo se publica bajo solicitud.
          mkdir -p deploy-nichos-assets/assets
          for file in \
            PLN-concavo.png \
            PLN-convexo.png \
            SPN-concavo.png \
            SPN-convexo.png; do
            cp "deploy/assets/$file" "deploy-nichos-assets/assets/$file"
          done

          # Paquete estructural. Solo se publica bajo solicitud.
          mkdir -p deploy-structural/assets/map deploy-structural/data
          cp deploy/assets/map/base-public.webp deploy-structural/assets/map/base-public.webp
          cp deploy/data/catalogo-propiedades.json deploy-structural/data/catalogo-propiedades.json
          cp deploy/data/inventario-base.json deploy-structural/data/inventario-base.json
          cp deploy/data/nichos-overlay.geojson deploy-structural/data/nichos-overlay.geojson
          cp deploy/data/secciones-top.geojson deploy-structural/data/secciones-top.geojson
          cp deploy/data/secciones.geojson deploy-structural/data/secciones.geojson
          cp -R deploy/data/lotes deploy-structural/data/lotes

          echo 'Paquete normal:'
          du -sh deploy-code
          echo 'Referencias visuales:'
          du -sh deploy-visual
          echo 'Imagenes grandes Nichos V2:'
          du -sh deploy-nichos-assets
          echo 'Datos estructurales:'
          du -sh deploy-structural

      - name: Diagnosticar puerto FTPS
        shell: bash
        continue-on-error: true
        run: |
          set +e
          echo 'Resolucion DNS:'
          getent ahostsv4 whm95.mxwebserver.com | head -5
          echo 'Prueba TCP a puerto 21 (15 segundos):'
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/whm95.mxwebserver.com/21'
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo 'Puerto 21 accesible desde el runner.'
          else
            echo '::warning::No se pudo abrir TCP/21 desde el runner. Si el despliegue falla tambien, revisar firewall/FTP en cPanel.'
          fi
          exit 0

      - name: Publicar solo referencias visuales
        if: ${{ inputs.publicar_solo_referencias_visuales == true }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: whm95.mxwebserver.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 180000
          local-dir: ./deploy-visual/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-visual-v2.json
          dry-run: false
          log-level: standard

      - name: Publicar codigo y datos pequenos
        if: ${{ inputs.publicar_solo_referencias_visuales == false }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: whm95.mxwebserver.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 180000
          local-dir: ./deploy-code/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-code-v2.json
          dry-run: false
          log-level: standard

      - name: Publicar imagenes grandes de Nichos V2
        if: ${{ inputs.publicar_solo_referencias_visuales == false && inputs.publicar_imagenes_nichos_v2 == true }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: whm95.mxwebserver.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 900000
          local-dir: ./deploy-nichos-assets/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-nichos-v2.json
          dry-run: false
          log-level: standard

      - name: Publicar datos estructurales
        if: ${{ inputs.publicar_solo_referencias_visuales == false && inputs.publicar_datos_estructurales == true }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: whm95.mxwebserver.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 900000
          local-dir: ./deploy-structural/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-structural-v2.json
          dry-run: false
          log-level: standard
