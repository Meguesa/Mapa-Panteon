name: Publicar Mapa independiente en cPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mapa-independiente
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Mapa
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar MSAL local para produccion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-msal
          npm install --prefix .tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir paquete autonomo del Mapa
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_portal_map.py
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js
          rm -rf .tmp-msal

      - name: Validar paquete y datos estructurales
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/index.php
          test -s deploy/app.js
          test -s deploy/styles.css
          test -s deploy/sharepoint-inventario.js
          test -s deploy/public-ui-fixes.js
          test -s deploy/portal-integration.css
          test -s deploy/account-menu.css
          test -s deploy/mapa-enhancements.js
          test -s deploy/assets/logo.jpg
          test -s deploy/assets/map/base-public.webp
          test -s deploy/vendor/msal-browser.min.js
          test -d deploy/data
          test -d deploy/assets/nichos
          test -s deploy/data/secciones.geojson
          test -s deploy/data/secciones-top.geojson
          test -s deploy/data/catalogo-propiedades.json
          test -s deploy/data/inventario-base.json
          test -s deploy/data/inventario-overrides.json
          test -s deploy/data/paquetes.json
          php -l deploy/index.php
          grep -q 'Mapa del Panteón' deploy/index.php
          grep -q 'portal_require_authentication' deploy/index.php

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('deploy/data').rglob('*.json')) + list(Path('deploy/data').rglob('*.geojson'))
          if not files:
              raise SystemExit('No se encontraron archivos JSON/GeoJSON en deploy/data')

          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f'Archivo vacio: {path}')
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  raise SystemExit(f'JSON invalido en {path}: {exc}')

          print(f'Validados correctamente {len(files)} archivos JSON/GeoJSON.')
          PY

      - name: Instalar cliente FTPS resiliente
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Preparar bloques de publicacion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upload-root upload-data-base upload-assets-base
          mkdir -p upload-root upload-data-base upload-assets-base

          find deploy -maxdepth 1 -type f -exec cp -p {} upload-root/ \;
          find deploy/data -maxdepth 1 -type f -exec cp -p {} upload-data-base/ \;
          find deploy/assets -maxdepth 1 -type f -exec cp -p {} upload-assets-base/ \;

      - name: Publicar Mapa por bloques con reintentos FTPS
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          upload_block() {
            local local_dir="$1"
            local remote_dir="$2"
            local label="$3"

            if [ ! -d "$local_dir" ]; then
              echo "Bloque omitido porque no existe: $label ($local_dir)"
              return 0
            fi

            for attempt in 1 2 3 4; do
              echo "[$label] intento ${attempt} de 4..."

              if lftp -u "$FTP_USERNAME","$FTP_PASSWORD" whm95.mxwebserver.com -e "
                set cmd:fail-exit yes;
                set net:timeout 30;
                set net:max-retries 1;
                set net:reconnect-interval-base 5;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                mirror --reverse --overwrite --continue --verbose --parallel=1 '$local_dir' '$remote_dir';
                bye;
              "; then
                echo "[$label] publicado correctamente."
                return 0
              fi

              if [ "$attempt" -lt 4 ]; then
                echo "[$label] fallo de transferencia. Reintento en 12 segundos..."
                sleep 12
              fi
            done

            echo "[$label] no pudo publicarse despues de 4 intentos."
            return 1
          }

          # Las carpetas destino ya existen en /mapa/. No se ejecuta mkdir remoto,
          # porque este servidor cPanel devuelve 550 cuando la carpeta ya existe.
          upload_block "./upload-root/" "./" "Archivos raiz"
          upload_block "./upload-data-base/" "./data/" "Datos base JSON/GeoJSON"
          upload_block "./deploy/vendor/" "./vendor/" "MSAL local"
          upload_block "./upload-assets-base/" "./assets/" "Assets base"
          upload_block "./deploy/assets/map/" "./assets/map/" "Imagen base del mapa"
          upload_block "./deploy/assets/nichos/" "./assets/nichos/" "Imagenes de nichos"
          upload_block "./deploy/data/lotes/" "./data/lotes/" "Geometrias de lotes"
          upload_block "./deploy/data/nichos/" "./data/nichos/" "Datos de nichos"

          echo "Publicacion completa del Mapa terminada por bloques."
