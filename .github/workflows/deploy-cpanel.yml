name: Publicar Mapa independiente en cPanel

on:
  workflow_dispatch:
    inputs:
      publicar_datos_estructurales:
        description: 'Republicar tambien GeoJSON, geometrías y activos estructurales'
        required: false
        default: false
        type: boolean
      publicar_solo_referencias_visuales:
        description: 'Publicar solo el JS y las fotos de referencias visuales (Americano/VIP)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-mapa-independiente
  cancel-in-progress: true

jobs:
  deploy:
    name: Validar y publicar Mapa
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar MSAL local para produccion
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-msal
          npm install --prefix .tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir paquete autonomo del Mapa
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_portal_map.py
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js
          rm -rf .tmp-msal

      - name: Validar paquete y datos estructurales
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/index.php
          test -s deploy/app.js
          test -s deploy/styles.css
          test -s deploy/sharepoint-inventario.js
          test -s deploy/public-ui-fixes.js
          test -s deploy/section-visual-references.js
          test -s deploy/portal-integration.css
          test -s deploy/account-menu.css
          test -s deploy/mapa-enhancements.js
          test -s deploy/assets/logo.jpg
          test -s deploy/assets/map/base-public.webp
          test -s deploy/assets/americano-01.webp
          test -s deploy/assets/americano-02.webp
          test -s deploy/assets/americano-03.webp
          test -s deploy/assets/americano-04.webp
          test -s deploy/assets/vip-01.webp
          test -s deploy/assets/vip-02.webp
          test -s deploy/assets/vip-03.webp
          test -s deploy/vendor/msal-browser.min.js
          test -d deploy/data
          test -s deploy/data/lotes.json
          test -s deploy/data/secciones.geojson
          test -s deploy/data/secciones-top.geojson
          test -s deploy/data/catalogo-propiedades.json
          test -s deploy/data/inventario-base.json
          test -s deploy/data/inventario-overrides.json
          test -s deploy/data/paquetes.json
          php -l deploy/index.php
          grep -q 'Mapa del Panteón' deploy/index.php
          grep -q 'portal_require_authentication' deploy/index.php
          grep -q 'section-visual-references.js' deploy/index.php

          python3 - <<'PY'
          import json
          from pathlib import Path

          files = list(Path('deploy/data').rglob('*.json')) + list(Path('deploy/data').rglob('*.geojson'))
          if not files:
              raise SystemExit('No se encontraron archivos JSON/GeoJSON en deploy/data')

          for path in files:
              if path.stat().st_size == 0:
                  raise SystemExit(f'Archivo vacio: {path}')
              try:
                  with path.open('r', encoding='utf-8') as fh:
                      json.load(fh)
              except Exception as exc:
                  raise SystemExit(f'JSON invalido en {path}: {exc}')

          print(f'Validados correctamente {len(files)} archivos JSON/GeoJSON.')
          PY

      - name: Instalar cliente FTPS resiliente
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar archivos del Mapa individualmente
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FULL_DATA: ${{ inputs.publicar_datos_estructurales }}
          VISUAL_ONLY: ${{ inputs.publicar_solo_referencias_visuales }}
        run: |
          set -euo pipefail

          upload_file() {
            local local_file="$1"
            local remote_file="$2"
            local label="$3"

            if [ ! -f "$local_file" ]; then
              echo "[$label] ERROR: no existe $local_file"
              return 1
            fi

            for attempt in 1 2 3; do
              echo "[$label] intento ${attempt} de 3 -> ${remote_file}"

              if timeout --kill-after=8s 45s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://whm95.mxwebserver.com:21" -e "
                set cmd:fail-exit yes;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ftp:sync-mode false;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                set net:timeout 20;
                set net:max-retries 0;
                put '$local_file' -o '$remote_file';
                bye;
              "; then
                echo "[$label] OK"
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "[$label] transferencia fallida. Reintento en 8 segundos..."
                sleep 8
              fi
            done

            echo "[$label] ERROR despues de 3 intentos"
            return 1
          }

          upload_visual_references_batch() {
            for attempt in 1 2 3; do
              echo "[referencias visuales] lote completo: intento ${attempt} de 3"

              if timeout --kill-after=10s 180s lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://whm95.mxwebserver.com:21" -e "
                set cmd:fail-exit yes;
                set ftp:passive-mode true;
                set ftp:ssl-force true;
                set ftp:ssl-protect-data true;
                set ftp:ssl-auth TLS;
                set ftp:sync-mode true;
                set ssl:verify-certificate yes;
                set ssl:check-hostname yes;
                set net:timeout 30;
                set net:max-retries 1;
                mkdir -p assets;
                put 'deploy/section-visual-references.js' -o 'section-visual-references.js';
                put 'deploy/assets/americano-01.webp' -o 'assets/americano-01.webp';
                put 'deploy/assets/americano-02.webp' -o 'assets/americano-02.webp';
                put 'deploy/assets/americano-03.webp' -o 'assets/americano-03.webp';
                put 'deploy/assets/americano-04.webp' -o 'assets/americano-04.webp';
                put 'deploy/assets/vip-01.webp' -o 'assets/vip-01.webp';
                put 'deploy/assets/vip-02.webp' -o 'assets/vip-02.webp';
                put 'deploy/assets/vip-03.webp' -o 'assets/vip-03.webp';
                bye;
              "; then
                echo "[referencias visuales] JS y 7 imagenes publicados correctamente en una sola sesion FTPS."
                return 0
              fi

              if [ "$attempt" -lt 3 ]; then
                echo "[referencias visuales] lote fallido. Reintento en 12 segundos..."
                sleep 12
              fi
            done

            echo "[referencias visuales] ERROR despues de 3 intentos del lote completo"
            return 1
          }

          if [ "$VISUAL_ONLY" = "true" ]; then
            echo "=== Publicacion exclusiva de referencias visuales ==="
            upload_visual_references_batch
            echo "Publicacion exclusiva de referencias visuales completada correctamente."
            exit 0
          fi

          echo "=== Publicacion de codigo principal ==="
          upload_file "deploy/index.php" "index.php" "index.php"
          upload_file "deploy/app.js" "app.js" "app.js"
          upload_file "deploy/styles.css" "styles.css" "styles.css"
          upload_file "deploy/portal-integration.css" "portal-integration.css" "portal-integration.css"
          upload_file "deploy/account-menu.css" "account-menu.css" "account-menu.css"
          upload_file "deploy/mapa-enhancements.js" "mapa-enhancements.js" "mapa-enhancements.js"
          upload_file "deploy/public-ui-fixes.js" "public-ui-fixes.js" "public-ui-fixes.js"
          upload_file "deploy/section-visual-references.js" "section-visual-references.js" "referencias visuales"
          upload_file "deploy/sharepoint-inventario.js" "sharepoint-inventario.js" "sharepoint-inventario.js"
          upload_file "deploy/vendor/msal-browser.min.js" "vendor/msal-browser.min.js" "MSAL local"

          echo "=== Referencias visuales ==="
          upload_file "deploy/assets/americano-01.webp" "assets/americano-01.webp" "americano-01"
          upload_file "deploy/assets/americano-02.webp" "assets/americano-02.webp" "americano-02"
          upload_file "deploy/assets/americano-03.webp" "assets/americano-03.webp" "americano-03"
          upload_file "deploy/assets/americano-04.webp" "assets/americano-04.webp" "americano-04"
          upload_file "deploy/assets/vip-01.webp" "assets/vip-01.webp" "vip-01"
          upload_file "deploy/assets/vip-02.webp" "assets/vip-02.webp" "vip-02"
          upload_file "deploy/assets/vip-03.webp" "assets/vip-03.webp" "vip-03"

          echo "=== Archivos de datos pequenos necesarios ==="
          upload_file "deploy/data/lotes.json" "data/lotes.json" "lotes.json"
          upload_file "deploy/data/paquetes.json" "data/paquetes.json" "paquetes.json"
          upload_file "deploy/data/inventario-overrides.json" "data/inventario-overrides.json" "inventario-overrides.json"

          if [ "$FULL_DATA" = "true" ]; then
            echo "=== Republicacion estructural solicitada ==="

            upload_file "deploy/data/catalogo-propiedades.json" "data/catalogo-propiedades.json" "catalogo-propiedades.json"
            upload_file "deploy/data/inventario-base.json" "data/inventario-base.json" "inventario-base.json"
            upload_file "deploy/data/nichos-overlay.geojson" "data/nichos-overlay.geojson" "nichos-overlay.geojson"
            upload_file "deploy/data/nichos-zonas.geojson" "data/nichos-zonas.geojson" "nichos-zonas.geojson"
            upload_file "deploy/data/secciones-top.geojson" "data/secciones-top.geojson" "secciones-top.geojson"
            upload_file "deploy/data/secciones.geojson" "data/secciones.geojson" "secciones.geojson"
            upload_file "deploy/assets/logo.jpg" "assets/logo.jpg" "logo"
            upload_file "deploy/assets/map/base-public.webp" "assets/map/base-public.webp" "mapa base"

            while IFS= read -r -d '' file; do
              remote="${file#deploy/}"
              upload_file "$file" "$remote" "$remote"
            done < <(find deploy/data/lotes -type f -print0 | sort -z)

            while IFS= read -r -d '' file; do
              remote="${file#deploy/}"
              upload_file "$file" "$remote" "$remote"
            done < <(find deploy/data/nichos -type f -print0 | sort -z)

            echo "Las imagenes grandes de assets/nichos se mantienen fuera del FTPS para evitar timeouts."
          else
            echo "Datos estructurales sin cambios: se conserva la version estable ya publicada en cPanel."
          fi

          echo "Publicacion incremental del Mapa completada correctamente."
