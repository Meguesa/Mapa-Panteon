name: Finalizar calibracion Nichos V2

on:
  push:
    branches:
      - preview/nichos-v2-sabbathycal
    paths:
      - .github/workflows/apply-nichos-v2-calibration.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          ref: preview/nichos-v2-sabbathycal
          fetch-depth: 0

      - name: Normalizar formato del modo Todos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('nichos-v2-preview.js')
          source = path.read_text(encoding='utf-8')
          pattern = r"    if \(state\.activeFilter === 'todos'\) \{\n\s*return \{ \.\.\.collection, features: \[\] \};\n\s*\}"
          replacement = "    if (state.activeFilter === 'todos') {\n      return { ...collection, features: [] };\n    }"
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise RuntimeError(f'Bloques Todos reemplazados: {count}; se esperaba 1')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validar resultado final
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_nichos_v2_preview.py
          node --check nichos-v2-preview.js
          python3 tools/build_nichos_v2_preview.py
          node --check deploy/nichos-v2-preview.js
          grep -q "state.activeFilter === 'todos'" deploy/nichos-v2-preview.js
          grep -q "features: \[\]" deploy/nichos-v2-preview.js
          grep -q "preferCanvas: false" deploy/nichos-v2-preview.js
          grep -q "nichos-v2-preview.js?v=10" deploy/index.php
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {
              'PLN-concavo.geojson': 402,
              'PLN-convexo.geojson': 474,
              'SPN-concavo.geojson': 306,
              'SPN-convexo.geojson': 360,
          }
          for filename, count in expected.items():
              data = json.loads((Path('deploy/data') / filename).read_text(encoding='utf-8'))
              actual = len(data.get('features', []))
              if actual != count:
                  raise SystemExit(f'{filename}: {actual} != {count}')
          print('Resultado final validado: 1542 nichos.')
          PY
          git diff --check

      - name: Retirar auxiliares temporales y guardar
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/analyze-nichos-alignment.yml \
            .github/workflows/export-nichos-reference-images.yml \
            .github/workflows/apply-nichos-v2-calibration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nichos-v2-preview.js
          git commit -m "Finalizar calibración de Nichos V2 y retirar auxiliares [skip ci]"
          git push origin HEAD:preview/nichos-v2-sabbathycal
