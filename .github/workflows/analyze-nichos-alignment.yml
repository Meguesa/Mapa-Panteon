name: Diagnosticar alineacion Nichos V2

on:
  push:
    branches:
      - preview/nichos-v2-sabbathycal
    paths:
      - '.github/workflows/analyze-nichos-alignment.yml'
      - 'assets/nichos-v2-src/**'
      - 'tools/build_nichos_v2_preview.py'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Analizar separadores de las imagenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p alignment-artifact
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import numpy as np
          from PIL import Image, ImageDraw

          root = Path('assets/nichos-v2-src')
          out = Path('alignment-artifact')

          specs = {
              'PLN-concavo': dict(x0=14.0, x1=2034.0, y0=22.0, y1=192.0, rows=6, columns=67),
              'PLN-convexo': dict(x0=12.0, x1=2034.0, y0=20.0, y1=164.0, rows=6, columns=79),
              'SPN-concavo': dict(x0=31.0, x1=2009.0, y0=23.0, y1=237.0, rows=6, columns=51),
              'SPN-convexo': dict(x0=22.0, x1=2034.0, y0=20.0, y1=207.0, rows=6, columns=60),
          }

          def smooth(values, radius=2):
              kernel = np.ones(radius * 2 + 1, dtype=np.float64)
              kernel /= kernel.sum()
              return np.convolve(values, kernel, mode='same')

          def refine_positions(score, expected, radius, lower, upper):
              refined = []
              for value in expected:
                  center = int(round(value))
                  lo = max(lower, center - radius)
                  hi = min(upper, center + radius)
                  if hi <= lo:
                      refined.append(float(value))
                      continue
                  segment = score[lo:hi + 1]
                  peak = int(np.argmax(segment)) + lo
                  refined.append(float(peak))
              # Mantener el orden y evitar que dos limites colapsen en la misma linea.
              for i in range(1, len(refined)):
                  if refined[i] <= refined[i - 1]:
                      refined[i] = max(float(expected[i]), refined[i - 1] + 1.0)
              return refined

          report = {}
          for name, spec in specs.items():
              source = root / f'{name}.png'
              image = Image.open(source).convert('RGB')
              arr = np.asarray(image, dtype=np.float64)
              gray = 0.2126 * arr[:, :, 0] + 0.7152 * arr[:, :, 1] + 0.0722 * arr[:, :, 2]
              height, width = gray.shape

              x0 = int(max(0, math.floor(spec['x0'])))
              x1 = int(min(width - 1, math.ceil(spec['x1'])))
              y0 = int(max(0, math.floor(spec['y0'])))
              y1 = int(min(height - 1, math.ceil(spec['y1'])))

              gx = np.abs(np.diff(gray[y0:y1 + 1, :], axis=1)).mean(axis=0)
              gx = np.pad(gx, (0, 1), mode='edge')
              vertical_dark = 255.0 - gray[y0:y1 + 1, :].mean(axis=0)
              vertical_score = smooth(gx + 0.12 * vertical_dark, 1)

              gy = np.abs(np.diff(gray[:, x0:x1 + 1], axis=0)).mean(axis=1)
              gy = np.pad(gy, (0, 1), mode='edge')
              horizontal_dark = 255.0 - gray[:, x0:x1 + 1].mean(axis=1)
              horizontal_score = smooth(gy + 0.12 * horizontal_dark, 1)

              expected_x = np.linspace(spec['x0'], spec['x1'], spec['columns'] + 1)
              expected_y = np.linspace(spec['y0'], spec['y1'], spec['rows'] + 1)
              detected_x = refine_positions(vertical_score, expected_x, 7, 0, width - 1)
              detected_y = refine_positions(horizontal_score, expected_y, 5, 0, height - 1)

              dx = np.asarray(detected_x) - expected_x
              dy = np.asarray(detected_y) - expected_y
              report[name] = {
                  'width': width,
                  'height': height,
                  'expected_x': [round(float(v), 4) for v in expected_x],
                  'detected_x': [round(float(v), 4) for v in detected_x],
                  'delta_x': [round(float(v), 4) for v in dx],
                  'expected_y': [round(float(v), 4) for v in expected_y],
                  'detected_y': [round(float(v), 4) for v in detected_y],
                  'delta_y': [round(float(v), 4) for v in dy],
                  'delta_x_mean_abs': round(float(np.mean(np.abs(dx))), 4),
                  'delta_x_max_abs': round(float(np.max(np.abs(dx))), 4),
                  'delta_y_mean_abs': round(float(np.mean(np.abs(dy))), 4),
                  'delta_y_max_abs': round(float(np.max(np.abs(dy))), 4),
              }

              scale_y = 4
              annotated = image.resize((width, height * scale_y), Image.Resampling.NEAREST).convert('RGBA')
              overlay = Image.new('RGBA', annotated.size, (0, 0, 0, 0))
              draw = ImageDraw.Draw(overlay)
              for value in expected_x:
                  x = int(round(value))
                  draw.line((x, 0, x, annotated.height), fill=(255, 0, 0, 130), width=1)
              for value in detected_x:
                  x = int(round(value))
                  draw.line((x, 0, x, annotated.height), fill=(0, 255, 0, 180), width=1)
              for value in expected_y:
                  y = int(round(value * scale_y))
                  draw.line((0, y, width, y), fill=(255, 0, 0, 150), width=2)
              for value in detected_y:
                  y = int(round(value * scale_y))
                  draw.line((0, y, width, y), fill=(0, 255, 0, 190), width=2)
              Image.alpha_composite(annotated, overlay).convert('RGB').save(out / f'{name}-diagnostico.jpg', quality=94)

          (out / 'alignment-analysis.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          for name, values in report.items():
              print(name, values['width'], values['height'],
                    'dx medio/max', values['delta_x_mean_abs'], values['delta_x_max_abs'],
                    'dy medio/max', values['delta_y_mean_abs'], values['delta_y_max_abs'])
          PY

      - name: Guardar diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: nichos-alignment-diagnostic
          path: alignment-artifact
          if-no-files-found: error
          retention-days: 2
