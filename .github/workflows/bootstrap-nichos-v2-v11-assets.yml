name: Preparar imagenes Nichos V2 v11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-nichos-v2-v11-assets
  cancel-in-progress: false

jobs:
  preparar-assets:
    name: Descargar, validar y guardar imagenes actualizadas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Descargar imagenes entregadas por el usuario
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-nichos-v2-v11
          mkdir -p .tmp-nichos-v2-v11

          BASE_URL='https://filebin.net/nichos-v2-v11-20260909-a6f3c2d8'
          for name in PLN-concavo PLN-convexo SPN-concavo SPN-convexo; do
            curl --fail --location --retry 5 --retry-delay 5 \
              "${BASE_URL}/${name}.png" \
              --output ".tmp-nichos-v2-v11/${name}.png"
          done

      - name: Validar y convertir a WebP de alta calidad
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/nichos-v2-v11
          mkdir -p assets/nichos-v2-v11

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64

          specs = {
              'PLN-concavo': (2048, 213),
              'PLN-convexo': (2048, 183),
              'SPN-concavo': (2048, 273),
              'SPN-convexo': (2048, 236),
          }

          source_dir = Path('.tmp-nichos-v2-v11')
          destination_dir = Path('assets/nichos-v2-v11')
          destination_dir.mkdir(parents=True, exist_ok=True)

          for name, expected_size in specs.items():
              source = source_dir / f'{name}.png'
              with Image.open(source) as image:
                  image.load()
                  if image.size != expected_size:
                      raise SystemExit(
                          f'Dimensiones invalidas en {source}: {image.size} != {expected_size}'
                      )
                  converted = image.convert('RGB')
                  webp_path = source_dir / f'{name}.webp'
                  converted.save(webp_path, 'WEBP', quality=95, method=6)

              payload = webp_path.read_bytes()
              if len(payload) < 12 or payload[:4] != b'RIFF' or payload[8:12] != b'WEBP':
                  raise SystemExit(f'WebP invalido: {webp_path}')

              encoded = base64.b64encode(payload).decode('ascii')
              chunk_size = 32000
              for offset in range(0, len(encoded), chunk_size):
                  part = offset // chunk_size + 1
                  destination = destination_dir / f'{name}.webp.b64.{part:03d}'
                  destination.write_text(encoded[offset:offset + chunk_size], encoding='ascii')

              print(f'{name}: {expected_size[0]}x{expected_size[1]}, {len(payload)} bytes')
          PY

          rm -rf .tmp-nichos-v2-v11

      - name: Confirmar assets en la rama de preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/nichos-v2-v11

          if git diff --cached --quiet; then
            echo 'Los assets v11 ya estaban actualizados.'
            exit 0
          fi

          git commit -m 'Agregar imagenes actualizadas de Nichos V2 v11'
          git push origin "HEAD:${GITHUB_REF_NAME}"
