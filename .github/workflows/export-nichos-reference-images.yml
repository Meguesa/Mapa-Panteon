name: Exportar referencias Nichos V2

on:
  push:
    branches:
      - preview/nichos-v2-sabbathycal
    paths:
      - '.github/workflows/export-nichos-reference-images.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar referencias
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nichos-reference-images
          cp assets/nichos-v2-src/PLN-concavo.png nichos-reference-images/
          cp assets/nichos-v2-src/PLN-convexo.png nichos-reference-images/
          cp assets/nichos-v2-src/SPN-concavo.png nichos-reference-images/
          cp assets/nichos-v2-src/SPN-convexo.png nichos-reference-images/

      - name: Guardar referencias
        uses: actions/upload-artifact@v4
        with:
          name: nichos-reference-images
          path: nichos-reference-images
          if-no-files-found: error
          retention-days: 2
