name: Publicar preview de mapas base

on:
  push:
    branches:
      - preview/map-basemaps
    paths:
      - 'experiments/basemaps-preview/**'
      - '.github/workflows/deploy-basemaps-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mapa-basemaps-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar preview Basemaps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar main productivo
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Descargar preview
        uses: actions/checkout@v6
        with:
          ref: preview/map-basemaps
          path: source-preview

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          npm install --prefix source-main/.tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir mapa main
        shell: bash
        run: |
          set -euo pipefail
          cd source-main
          python3 tools/build_portal_map.py
          python3 tools/apply_nichos_v2_production.py
          cp src/js/sharepoint-inventario-portal.js deploy/sharepoint-inventario.js
          cp inventory.php deploy/inventory.php
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js

      - name: Construir preview
        shell: bash
        run: |
          set -euo pipefail
          python3 source-preview/experiments/basemaps-preview/build-production-preview.py
          php -l deploy-basemaps-preview/index.php
          php -l deploy-basemaps-preview/inventory.php
          node --check deploy-basemaps-preview/app.js
          node --check deploy-basemaps-preview/production-basemap-toggle.js
          du -sh deploy-basemaps-preview

      - name: Publicar preview en cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 180000
          local-dir: ./deploy-basemaps-preview/
          server-dir: ./preview-basemaps/
          state-name: .ftp-deploy-sync-state-basemaps-preview-v9.json
          dry-run: false
          log-level: standard
