name: Publicar preview de mapas base

on:
  push:
    branches:
      - preview/map-basemaps
    paths:
      - 'experiments/basemaps-preview/**'
      - '.github/workflows/deploy-basemaps-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mapa-basemaps-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar preview Basemaps
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar main productivo
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Descargar preview
        uses: actions/checkout@v6
        with:
          ref: preview/map-basemaps
          path: source-preview

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          npm install --prefix source-main/.tmp-msal --no-save --package-lock=false @azure/msal-browser@2.38.3

      - name: Construir mapa main
        shell: bash
        run: |
          set -euo pipefail
          cd source-main
          python3 tools/build_portal_map.py
          python3 tools/apply_nichos_v2_production.py
          cp src/js/sharepoint-inventario-portal.js deploy/sharepoint-inventario.js
          cp inventory.php deploy/inventory.php
          mkdir -p deploy/vendor
          cp .tmp-msal/node_modules/@azure/msal-browser/lib/msal-browser.min.js deploy/vendor/msal-browser.min.js

      - name: Construir preview
        shell: bash
        run: |
          set -euo pipefail
          python3 source-preview/experiments/basemaps-preview/build-production-preview.py
          python3 source-preview/experiments/basemaps-preview/install-mobile-search.py deploy-basemaps-preview
          python3 source-preview/experiments/basemaps-preview/build_preview_assets.py \
            source-main/assets/map/base-public.webp \
            deploy-basemaps-preview

          php -l deploy-basemaps-preview/index.php
          php -l deploy-basemaps-preview/inventory.php
          node --check deploy-basemaps-preview/app.js
          node --check deploy-basemaps-preview/production-basemap-toggle.js
          node --check deploy-basemaps-preview/route-editor.js
          node --check deploy-basemaps-preview/route-editor-events-fix.js
          node --check deploy-basemaps-preview/route-graph.js
          node --check deploy-basemaps-preview/route-render.js
          node --check deploy-basemaps-preview/route-lot-hook.js
          node --check deploy-basemaps-preview/route-nicho-hook.js
          node --check deploy-basemaps-preview/route-toolbar.js
          node --check deploy-basemaps-preview/mobile-search-menu.js
          test -s deploy-basemaps-preview/route-navigation.css
          test -s deploy-basemaps-preview/mobile-search-menu.css
          test -s deploy-basemaps-preview/base-lines.webp
          test -s deploy-basemaps-preview/satellite-base.webp
          test -s deploy-basemaps-preview/data/rutas-panteon.geojson
          test -s deploy-basemaps-preview/data/rutas-panteon-compact.json
          grep -q 'mobile-search-menu.css?v=1' deploy-basemaps-preview/index.php
          grep -q 'mobile-search-menu.js?v=1' deploy-basemaps-preview/index.php

          python3 - <<'PY'
          import json
          from collections import defaultdict
          from PIL import Image
          from pathlib import Path

          root = Path('deploy-basemaps-preview')
          lines = Image.open(root / 'base-lines.webp')
          sat = Image.open(root / 'satellite-base.webp')

          if sat.width <= lines.width or sat.height <= lines.height:
              raise SystemExit(f'El satelite no esta extendido: lineas={lines.size}, satelite={sat.size}')

          ratio_lines = lines.width / lines.height
          ratio_sat = sat.width / sat.height
          if abs(ratio_lines - ratio_sat) > 0.02:
              raise SystemExit(f'Proporcion distinta: lineas={ratio_lines:.4f}, satelite={ratio_sat:.4f}')

          if lines.mode != 'RGBA':
              lines = lines.convert('RGBA')
          alpha = lines.getchannel('A')
          extrema = alpha.getextrema()
          if extrema[0] != 0 or extrema[1] == 0:
              raise SystemExit(f'Alpha invalido en plano transparente: {extrema}')

          routes_path = root / 'data' / 'rutas-panteon.geojson'
          with routes_path.open('r', encoding='utf-8') as fh:
              routes = json.load(fh)
          if routes.get('type') != 'FeatureCollection':
              raise SystemExit('rutas-panteon.geojson no es FeatureCollection')
          if routes.get('properties', {}).get('schema') != 'jp-routing-v1':
              raise SystemExit('Schema de rutas invalido')
          if len(routes.get('features', [])) != 96:
              raise SystemExit(f'Red completa inesperada: {len(routes.get("features", []))} features')

          compact_path = root / 'data' / 'rutas-panteon-compact.json'
          compact = json.loads(compact_path.read_text(encoding='utf-8'))
          if compact.get('e') != [8512, 2672]:
              raise SystemExit('Entrada principal inesperada')
          if len(compact.get('r', [])) != 95:
              raise SystemExit(f'Tramos inesperados: {len(compact.get("r", []))}')

          def k(c):
              return (round(float(c[0]), 3), round(float(c[1]), 3))

          adj = defaultdict(set)
          for _, coords in compact['r']:
              for a, b in zip(coords, coords[1:]):
                  ka, kb = k(a), k(b)
                  adj[ka].add(kb)
                  adj[kb].add(ka)

          seen = set()
          components = 0
          for node in adj:
              if node in seen:
                  continue
              components += 1
              stack = [node]
              while stack:
                  cur = stack.pop()
                  if cur in seen:
                      continue
                  seen.add(cur)
                  stack.extend(adj[cur] - seen)

          if components != 1:
              raise SystemExit(f'La red de navegacion tiene {components} componentes')
          if k(compact['e']) not in adj:
              raise SystemExit('La entrada principal no esta conectada al grafo')

          print(f'Lineas transparentes: {lines.size}; alpha={extrema}')
          print(f'Satelite extendido: {sat.size}')
          print(f'Red de rutas validada: 95 tramos, {len(adj)} nodos, 1 componente')
          PY
          du -sh deploy-basemaps-preview

      - name: Publicar preview en cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          timeout: 180000
          local-dir: ./deploy-basemaps-preview/
          server-dir: ./preview-basemaps/
          state-name: .ftp-deploy-sync-state-basemaps-preview-v14.json
          dry-run: false
          log-level: standard
