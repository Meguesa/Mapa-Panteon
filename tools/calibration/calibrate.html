<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Calibración - Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    header{padding:10px 12px;border-bottom:1px solid #e5e7eb;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px;font-size:12px}
    button{height:34px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:0 10px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.45;cursor:not-allowed}
    main{display:grid;grid-template-columns:1fr 420px;height:calc(100vh - 58px)}
    #map{height:100%;background:#f3f4f6}
    aside{border-left:1px solid #e5e7eb;padding:12px;overflow:auto}
    pre{white-space:pre-wrap;word-break:break-word;background:#0b1020;color:#dbeafe;padding:10px;border-radius:10px;font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border-bottom:1px solid #e5e7eb;padding:6px 4px;text-align:left}
    .muted{color:#6b7280;font-size:12px}
    .rowbtn{border:1px solid #e5e7eb;border-radius:8px;background:#fff;padding:4px 8px;font-weight:700;cursor:pointer}
    .danger{border-color:#ef4444;color:#b91c1c}
    .ok{border-color:#16a34a;color:#166534}
    #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .15s ease;font-size:13px;max-width:min(92vw,720px)}
    #toast.show{opacity:1}
    .numMarker{width:22px;height:22px;border-radius:999px;background:#ef4444;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
    .topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .linklike{font-size:12px;color:#2563eb;text-decoration:none;font-weight:800}
    .linklike:hover{text-decoration:underline}
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="pill" id="modePill"></div>
      <div class="pill" id="imgInfo">IMG: —</div>
      <div class="pill">Click en puntos MUY claros (mismos puntos en OLD y NEW).</div>
      <a class="linklike" href="?img=old">Abrir OLD</a>
      <a class="linklike" href="?img=new">Abrir NEW</a>
    </div>
    <div style="flex:1"></div>
    <button id="copyBtn" class="ok">Copiar JSON</button>
    <button id="undoBtn">Undo</button>
    <button id="clearBtn" class="danger">Borrar todo</button>
  </header>

  <main>
    <div id="map"></div>
    <aside>
      <h3 style="margin:0 0 6px 0;">Puntos capturados</h3>
      <div class="muted">Cada punto es <b>[x,y]</b> en pixeles del mapa: <b>x = horizontal</b>, <b>y = vertical</b>.</div>
      <div style="margin:10px 0 6px 0" class="muted">Guardado local: <code id="storageKey"></code></div>
      <div style="margin:8px 0"><table><thead><tr><th>#</th><th>x</th><th>y</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
      <h3 style="margin:12px 0 6px 0;">JSON</h3>
      <pre id="jsonOut">[]</pre>
      <div class="muted" style="margin-top:10px">Captura los mismos puntos en OLD y NEW y en el mismo orden.</div>
    </aside>
  </main>

  <div id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function toast(msg, ms=1800){
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(()=>el.classList.remove("show"), ms);
    }

    const params = new URLSearchParams(location.search);
    const imgMode = (params.get("img") || "new").toLowerCase();
    const IMG_OLD = "https://raw.githubusercontent.com/Meguesa/Mapa-Panteon/backup/pre-cleanup-20260910/assets/map/base-old.png";
    const IMG_NEW = "../../assets/map/base.png";
    const IMG_URL = (imgMode === "old") ? IMG_OLD : IMG_NEW;

    document.getElementById("modePill").textContent = (imgMode === "old") ? "MODO: OLD (respaldo)" : "MODO: NEW (base.png)";
    const key = "calib_points_" + imgMode;
    document.getElementById("storageKey").textContent = key;
    let pts = JSON.parse(localStorage.getItem(key) || "[]");

    const map = L.map("map", {crs:L.CRS.Simple,minZoom:-3,maxZoom:7,zoomSnap:0.25,zoomDelta:0.25,preferCanvas:true});
    const markers = [];

    function makeNumIcon(n){return L.divIcon({className:"",html:`<div class="numMarker">${n}</div>`,iconSize:[22,22],iconAnchor:[11,11]});}
    function clearMarkerLayers(){while(markers.length){const m=markers.pop();try{map.removeLayer(m);}catch{}}}
    function redrawMarkers(){clearMarkerLayers();pts.forEach((p,i)=>markers.push(L.marker([p[1],p[0]],{icon:makeNumIcon(i+1),interactive:false}).addTo(map)));}

    function render(){
      localStorage.setItem(key,JSON.stringify(pts));
      const tbody=document.getElementById("rows");
      tbody.innerHTML=pts.map((p,i)=>`<tr><td>${i+1}</td><td>${Math.round(p[0])}</td><td>${Math.round(p[1])}</td><td style="text-align:right"><button class="rowbtn danger" data-del="${i}">X</button></td></tr>`).join("");
      document.getElementById("jsonOut").textContent=JSON.stringify(pts.map(p=>[Math.round(p[0]),Math.round(p[1])]),null,2);
      [...tbody.querySelectorAll("button[data-del]")].forEach(btn=>{btn.onclick=()=>{const idx=Number(btn.getAttribute("data-del"));if(!(idx>=0&&idx<pts.length))return;pts.splice(idx,1);redrawMarkers();render();};});
      document.getElementById("undoBtn").disabled=pts.length===0;
    }

    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>{
      const imgW=img.naturalWidth,imgH=img.naturalHeight;
      document.getElementById("imgInfo").textContent=`IMG: ${imgW} x ${imgH}`;
      const bounds=[[0,0],[imgH,imgW]];
      L.imageOverlay(IMG_URL,bounds).addTo(map);
      map.fitBounds(bounds);
      redrawMarkers();render();toast("Listo. Da click en puntos claros.",2200);
    };
    img.onerror=()=>toast("No pude cargar la imagen de calibracion.",3000);
    img.src=IMG_URL;

    map.on("click",e=>{pts.push([e.latlng.lng,e.latlng.lat]);redrawMarkers();render();});
    document.getElementById("clearBtn").onclick=()=>{if(!confirm("¿Borrar TODOS los puntos de este modo?"))return;pts=[];localStorage.removeItem(key);clearMarkerLayers();render();};
    document.getElementById("undoBtn").onclick=()=>{if(!pts.length)return;pts.pop();redrawMarkers();render();};
    document.getElementById("copyBtn").onclick=async()=>{const txt=document.getElementById("jsonOut").textContent;try{await navigator.clipboard.writeText(txt);toast("JSON copiado al portapapeles.",1800);}catch{toast("No pude copiar. Copia manual del recuadro JSON.",2600);}};
  </script>
</body>
</html>
